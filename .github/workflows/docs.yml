name: Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/docs.yml"
      - ".markdownlint.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-doc-links.mjs"
  push:
    branches:
      - develop
      - main
    paths:
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"
      - ".github/workflows/docs.yml"
      - ".markdownlint.jsonc"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-doc-links.mjs"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate documentation
        run: npm run docs:check
